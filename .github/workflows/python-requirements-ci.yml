name: Python requirements tests

on:
  push:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/**
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Test Python requirements parsing and SBOM output
        run: go test ./opensca/sca/python ./cmd/format ./cmd/detail .
