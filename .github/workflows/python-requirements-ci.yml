name: Python requirements tests

on:
  push:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - internal/versionaudit/**
      - .github/workflows/**
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - internal/versionaudit/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Test local version audit, parsers and SBOM output
        run: go test -mod=readonly ./internal/versionaudit ./opensca/endpoint ./opensca/sca/... ./cmd/format ./cmd/detail ./cmd/config ./opensca .
